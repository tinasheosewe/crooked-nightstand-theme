<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#d7d2c4;padding:46px;display:flex;gap:60px}
  .col{display:flex;flex-direction:column;gap:18px;align-items:center}
  .name{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#4a463d;font-weight:600}
  .row{display:flex;gap:26px;align-items:flex-end;background:#efeee8;padding:28px 34px;border-radius:14px;box-shadow:0 10px 38px rgba(0,0,0,.16)}
  .lab{font-size:11px;color:#7a756a;text-align:center;margin-top:8px}
  .tab{display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:13px;background:#dee1e6;color:#202124;border-radius:10px;width:230px;box-shadow:0 6px 22px rgba(0,0,0,.14)}
  .tab .x{margin-left:auto;opacity:.5}
  svg{display:block}
</style></head>
<body>
  <div class="col">
    <div class="name">Pink</div>
    <div class="row">
      <div><svg width="16" height="16" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#1A1A18"/><rect x="146" y="300" width="220" height="54" rx="13" fill="#F2EFE6"/><rect x="158" y="238" width="196" height="54" rx="13" fill="#F2EFE6"/><rect x="166" y="161" width="180" height="54" rx="13" fill="#E84A7F" transform="rotate(-9 256 188)"/></svg><div class="lab">16</div></div>
      <div><svg width="32" height="32" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#1A1A18"/><rect x="146" y="300" width="220" height="54" rx="13" fill="#F2EFE6"/><rect x="158" y="238" width="196" height="54" rx="13" fill="#F2EFE6"/><rect x="166" y="161" width="180" height="54" rx="13" fill="#E84A7F" transform="rotate(-9 256 188)"/></svg><div class="lab">32</div></div>
      <div><svg width="96" height="96" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#1A1A18"/><rect x="146" y="300" width="220" height="54" rx="13" fill="#F2EFE6"/><rect x="158" y="238" width="196" height="54" rx="13" fill="#F2EFE6"/><rect x="166" y="161" width="180" height="54" rx="13" fill="#E84A7F" transform="rotate(-9 256 188)"/></svg><div class="lab">96</div></div>
    </div>
    <div class="tab"><svg width="18" height="18" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#1A1A18"/><rect x="146" y="300" width="220" height="54" rx="13" fill="#F2EFE6"/><rect x="158" y="238" width="196" height="54" rx="13" fill="#F2EFE6"/><rect x="166" y="161" width="180" height="54" rx="13" fill="#E84A7F" transform="rotate(-9 256 188)"/></svg><span>Crooked Nightstand</span><span class="x">×</span></div>
  </div>

  <div class="col">
    <div class="name">Blue</div>
    <div class="row">
      <div><svg width="16" height="16" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#1A1A18"/><rect x="146" y="300" width="220" height="54" rx="13" fill="#F2EFE6"/><rect x="158" y="238" width="196" height="54" rx="13" fill="#F2EFE6"/><rect x="166" y="161" width="180" height="54" rx="13" fill="#5E82C8" transform="rotate(-9 256 188)"/></svg><div class="lab">16</div></div>
      <div><svg width="32" height="32" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#1A1A18"/><rect x="146" y="300" width="220" height="54" rx="13" fill="#F2EFE6"/><rect x="158" y="238" width="196" height="54" rx="13" fill="#F2EFE6"/><rect x="166" y="161" width="180" height="54" rx="13" fill="#5E82C8" transform="rotate(-9 256 188)"/></svg><div class="lab">32</div></div>
      <div><svg width="96" height="96" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#1A1A18"/><rect x="146" y="300" width="220" height="54" rx="13" fill="#F2EFE6"/><rect x="158" y="238" width="196" height="54" rx="13" fill="#F2EFE6"/><rect x="166" y="161" width="180" height="54" rx="13" fill="#5E82C8" transform="rotate(-9 256 188)"/></svg><div class="lab">96</div></div>
    </div>
    <div class="tab"><svg width="18" height="18" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#1A1A18"/><rect x="146" y="300" width="220" height="54" rx="13" fill="#F2EFE6"/><rect x="158" y="238" width="196" height="54" rx="13" fill="#F2EFE6"/><rect x="166" y="161" width="180" height="54" rx="13" fill="#5E82C8" transform="rotate(-9 256 188)"/></svg><span>Crooked Nightstand</span><span class="x">×</span></div>
  </div>
</body></html>
