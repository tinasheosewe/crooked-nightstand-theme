<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="../assets/css/screen.css">
<style>
  /* A real 390px phone frame, with the theme's mobile rules forced on
     (headless Chrome can't emulate the viewport, so we apply them directly) */
  body { background:#d7d2c4; margin:0; }
  .phone { width:390px; margin:24px auto; background:var(--bg); position:relative;
           box-shadow:0 10px 40px rgba(0,0,0,.22); overflow:hidden; min-height:300px; }
  .phone .reading-progress { position:absolute; }

  /* the ≤460 tweaks (headless can't trigger the media query at this frame size) */
  .phone .nav-list { display:none; }
  .phone .site-mark { font-size:.82rem; letter-spacing:.1em; }
  .phone .header-now-title { font-size:.9rem; }
  .phone .header-now-time { font-size:.58rem; }
</style>
</head>
<body>
<div class="phone">
  <div class="reading-progress" aria-hidden="true"><span style="width:42%"></span></div>
  <header class="site-header is-scrolled show-context" data-site-header>
    <div class="site-header-inner">
      <a class="site-mark" href="#">Crooked <span class="accent">Nightstand</span></a>
      <div class="header-now">
        <span class="header-now-title">The Lighthouse Keeper and the Long Cold Winter</span>
        <span class="header-now-time">5 min left</span>
      </div>
      <nav class="site-nav">
        <ul class="nav-list"><li class="nav-item"><a href="#">Stories</a></li><li class="nav-item"><a href="#">About</a></li></ul>
        <button class="theme-toggle" type="button" aria-label="Toggle"><svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.25"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg></button>
      </nav>
    </div>
  </header>
  <div class="gh-content" style="margin-top:1.6rem; padding-bottom:1.5rem">
    <p>The morning the light went out, Aron was already awake, listening to the gulls argue over nothing. He had kept the lamp for forty years, and it had never once asked him for anything in return.</p>
  </div>
</div>
</body>
</html>
